</head>

<body>
    <main>
        <section>
            <h1>Formula 1</h1>
            <form action="#" method="post" enctype="multipart/form-data">
                <fieldset id="form-corredor">
                    <legend>Corredor</legend>
                    <div class="row3">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre del corredor"
                            required>
                        <label for="apellidoP">Apellido Paterno:</label>
                        <input type="text" id="apellidoP" name="apellidoP"
                            placeholder="Ingrese el apellido paterno del corredor" required>
                        <label for="apellidoM">Apellido Materno:</label>
                        <input type="text" id="apellidoM" name="apellidoM"
                            placeholder="Ingrese el apellido materno del corredor" required>
                    </div>
                    <div class="row2">
                        <div id="edad">
                            <label for="edad">Edad:</label>
                            <input type="number" id="edad" name="edad" placeholder="Ingrese la edad del corredor"
                                required>
                        </div>
                        <div class="radio-input">
                            <label>Género:</label>
                            <input type="radio" id="masculino" name="genero" value="masculino" required />
                            <label for="masculino">Masculino</label>
                            <input type="radio" id="femenino" name="genero" value="femenino" required />
                            <label for="femenino">Femenino</label>
                        </div>
                    </div>
                    <div id="izquierda">
                        <label for="foto">Foto:</label>
                        <input type="file" id="foto" name="foto" required>
                    </div>
                    <button type="button" onclick="mostrarRespuestasCorredor()">Guardar</button>
                </fieldset>
            </form>
        </section>

                    <li><a href="relaciones.html">Relaciones</a></li>
                </ul>
            </nav>
        </aside>
    </main>
